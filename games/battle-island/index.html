<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>バトルアイランド | Sippy Games</title>
<meta name="description" content="3Dのしまをぶたいにたたかうバトルロイヤル！かべをたてて、ロボをたおそう！">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏝️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; }
  body {
    font-family: 'M PLUS Rounded 1c', 'Hiragino Maru Gothic ProN', sans-serif;
    background: #0a1a2a;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game { position: fixed; inset: 0; }
  canvas { display: block; }

  /* ===== HUD ===== */
  .hud { position: fixed; z-index: 10; pointer-events: none; }
  #hudTopLeft { top: 14px; left: 14px; }
  .bar-wrap { width: 220px; height: 22px; background: rgba(0,0,0,0.45); border-radius: 11px; margin-bottom: 8px; overflow: hidden; border: 2px solid rgba(255,255,255,0.25); position: relative; }
  .bar-fill { height: 100%; border-radius: 8px; transition: width 0.2s; }
  #hpFill { background: linear-gradient(90deg, #4ade80, #22c55e); width: 100%; }
  #shieldFill { background: linear-gradient(90deg, #60a5fa, #3b82f6); width: 0%; }
  .bar-label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 900; text-shadow: 0 1px 3px rgba(0,0,0,0.7); }

  #hudTopRight { top: 14px; right: 14px; text-align: right; }
  .info-chip {
    display: inline-block; background: rgba(0,0,0,0.45); border: 2px solid rgba(255,255,255,0.25);
    border-radius: 10px; padding: 4px 14px; font-size: 15px; font-weight: 900; margin-bottom: 6px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.7);
  }
  #stormChip { border-color: rgba(200,100,255,0.6); color: #e9c8ff; }

  #hudBottomLeft { bottom: 14px; left: 14px; }
  #woodChip { font-size: 20px; padding: 6px 18px; border-color: rgba(255,200,100,0.5); }

  #crosshair {
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 22px; height: 22px;
  }
  #crosshair::before, #crosshair::after {
    content: ''; position: absolute; background: #fff; box-shadow: 0 0 4px rgba(0,0,0,0.8); border-radius: 2px;
  }
  #crosshair::before { left: 50%; top: 0; width: 3px; height: 100%; transform: translateX(-50%); }
  #crosshair::after { top: 50%; left: 0; height: 3px; width: 100%; transform: translateY(-50%); }

  #hudHint {
    bottom: 14px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.4); border-radius: 10px; padding: 6px 16px;
    font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.85); white-space: nowrap;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #hudHint b { color: #ffd54a; }

  #msgCenter {
    top: 22%; left: 50%; transform: translate(-50%, -50%); text-align: center;
    font-size: clamp(22px, 4.5vw, 40px); font-weight: 900; color: #ffd54a;
    text-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 20px rgba(255,213,74,0.4);
    opacity: 0; transition: opacity 0.3s; white-space: nowrap;
  }

  #dmgFlash {
    inset: 0; background: radial-gradient(ellipse at center, transparent 40%, rgba(255,40,40,0.45) 100%);
    opacity: 0; transition: opacity 0.1s;
  }
  #dmgLayer { inset: 0; overflow: hidden; }
  .dmg-num {
    position: absolute; font-weight: 900; font-size: 22px; color: #ffd54a;
    text-shadow: 0 2px 0 rgba(0,0,0,0.6); transform: translate(-50%, -50%); pointer-events: none;
  }

  /* ===== Overlays ===== */
  .overlay {
    position: fixed; inset: 0; z-index: 100;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(8, 14, 40, 0.82); backdrop-filter: blur(6px); text-align: center; padding: 20px;
  }
  .overlay.hidden { display: none; }
  .title-badge {
    font-size: 13px; font-weight: 900; letter-spacing: 4px; color: #7dd8ff;
    margin-bottom: 10px; text-transform: uppercase;
  }
  .game-title {
    font-size: clamp(36px, 9vw, 72px); font-weight: 900; line-height: 1.1; margin-bottom: 6px;
    background: linear-gradient(180deg, #fff 20%, #ffd54a 60%, #ff9d2e 100%);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.4));
  }
  .subtitle { font-size: clamp(14px, 3vw, 19px); font-weight: 700; color: #b8d8f0; margin-bottom: 26px; }

  .color-select { display: flex; gap: 14px; margin-bottom: 26px; }
  .color-btn {
    width: 52px; height: 52px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.3);
    cursor: pointer; transition: transform 0.15s, border-color 0.15s;
  }
  .color-btn.selected { border-color: #fff; transform: scale(1.2); box-shadow: 0 0 16px rgba(255,255,255,0.5); }

  .big-btn {
    font-family: inherit; font-size: 24px; font-weight: 900; color: #1a2a0a;
    background: linear-gradient(180deg, #ffe066, #ffb830); border: none; border-radius: 16px;
    padding: 16px 56px; cursor: pointer; box-shadow: 0 6px 0 #c77f00, 0 10px 20px rgba(0,0,0,0.4);
    transition: transform 0.1s, box-shadow 0.1s; letter-spacing: 2px;
  }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c77f00; }

  .howto {
    margin-top: 30px; display: flex; gap: 10px 26px; flex-wrap: wrap; justify-content: center;
    font-size: 14px; font-weight: 700; color: #ccdcee; max-width: 560px;
  }
  .howto span { background: rgba(255,255,255,0.08); padding: 6px 14px; border-radius: 10px; }
  .howto b { color: #ffd54a; }

  #winOverlay .game-title { font-size: clamp(34px, 8vw, 64px); }
  .result-line { font-size: 20px; font-weight: 900; color: #fff; margin: 8px 0 24px; }
  .trophy { font-size: 80px; margin-bottom: 8px; animation: bounce 1s ease-in-out infinite; }
  @keyframes bounce { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-14px) } }

  /* ===== Touch controls ===== */
  #touchUI { position: fixed; inset: 0; z-index: 20; display: none; pointer-events: none; }
  body.touch #touchUI { display: block; }
  body.touch #hudHint { display: none; }
  #joyBase {
    position: absolute; left: 30px; bottom: 40px; width: 130px; height: 130px;
    border-radius: 50%; background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.3);
  }
  #joyThumb {
    position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; border-radius: 50%;
    background: rgba(255,255,255,0.45); transform: translate(-50%, -50%);
  }
  .touch-btn {
    position: absolute; border-radius: 50%; background: rgba(255,255,255,0.16);
    border: 2px solid rgba(255,255,255,0.35); display: flex; flex-direction: column;
    align-items: center; justify-content: center; font-weight: 900; color: #fff;
    pointer-events: auto; text-shadow: 0 1px 2px rgba(0,0,0,0.7);
  }
  .touch-btn:active { background: rgba(255,255,255,0.35); }
  #btnShoot { right: 26px; bottom: 90px; width: 92px; height: 92px; font-size: 34px; background: rgba(255,120,60,0.3); border-color: rgba(255,160,80,0.6); }
  #btnJump  { right: 132px; bottom: 34px; width: 68px; height: 68px; font-size: 26px; }
  #btnWall  { right: 26px; bottom: 200px; width: 64px; height: 64px; font-size: 12px; }
  #btnRamp  { right: 104px; bottom: 232px; width: 64px; height: 64px; font-size: 12px; }
  .touch-btn small { font-size: 10px; font-weight: 700; }
</style>
</head>
<body>
<div id="game"></div>

<!-- HUD -->
<div class="hud" id="hudTopLeft">
  <div class="bar-wrap"><div class="bar-fill" id="hpFill"></div><div class="bar-label" id="hpLabel">❤️ 100</div></div>
  <div class="bar-wrap"><div class="bar-fill" id="shieldFill"></div><div class="bar-label" id="shieldLabel">🛡️ 0</div></div>
</div>
<div class="hud" id="hudTopRight">
  <div class="info-chip" id="stormChip">🌀 ストーム</div><br>
  <div class="info-chip" id="enemyChip">🤖 のこり 0たい</div><br>
  <div class="info-chip" id="killChip">⭐ たおした 0</div>
</div>
<div class="hud" id="hudBottomLeft">
  <div class="info-chip" id="woodChip">🪵 0</div>
</div>
<div class="hud" id="crosshair"></div>
<div class="hud" id="hudHint"><b>WASD</b> うごく ／ <b>マウス</b> ねらう ／ <b>クリック</b> シュート ／ <b>スペース</b> ジャンプ ／ <b>Q</b> かべ ／ <b>E</b> スロープ</div>
<div class="hud" id="msgCenter"></div>
<div class="hud" id="dmgFlash"></div>
<div class="hud" id="dmgLayer"></div>

<!-- Touch UI -->
<div id="touchUI">
  <div id="joyBase"><div id="joyThumb"></div></div>
  <div class="touch-btn" id="btnShoot">⭐</div>
  <div class="touch-btn" id="btnJump">⬆️</div>
  <div class="touch-btn" id="btnWall">🧱<small>かべ</small></div>
  <div class="touch-btn" id="btnRamp">📐<small>スロープ</small></div>
</div>

<!-- Start screen -->
<div class="overlay" id="startOverlay">
  <div class="title-badge">Sippy Games Presents</div>
  <div class="game-title">バトル<br>アイランド</div>
  <div class="subtitle">🏝️ しまでたたかえ！さいごまでのこったらチャンピオン！</div>
  <div style="font-size:14px; font-weight:900; color:#b8d8f0; margin-bottom:10px;">スーツのいろをえらんでね</div>
  <div class="color-select" id="colorSelect">
    <button class="color-btn selected" data-color="#3b82f6" style="background:#3b82f6"></button>
    <button class="color-btn" data-color="#ef4444" style="background:#ef4444"></button>
    <button class="color-btn" data-color="#22c55e" style="background:#22c55e"></button>
    <button class="color-btn" data-color="#a855f7" style="background:#a855f7"></button>
  </div>
  <button class="big-btn" id="startBtn">スタート！</button>
  <div class="howto">
    <span>🌳 きをシュートして <b>もくざい</b>ゲット</span>
    <span>🧱 かべやスロープを<b>たてよう</b></span>
    <span>🤖 ロボをぜんぶたおせば<b>かち</b>！</span>
    <span>🌀 むらさきのストームに<b>ちゅうい</b>！</span>
  </div>
</div>

<!-- Pause -->
<div class="overlay hidden" id="pauseOverlay">
  <div class="game-title" style="font-size:36px">ポーズちゅう</div>
  <button class="big-btn" id="resumeBtn">つづける</button>
</div>

<!-- Win -->
<div class="overlay hidden" id="winOverlay">
  <div class="trophy">🏆</div>
  <div class="game-title">ビクトリー<br>ロイヤル！</div>
  <div class="result-line" id="winStats"></div>
  <button class="big-btn" onclick="location.reload()">もういちど あそぶ</button>
</div>

<!-- Lose -->
<div class="overlay hidden" id="loseOverlay">
  <div style="font-size:70px; margin-bottom:8px;">💫</div>
  <div class="game-title" style="background:linear-gradient(180deg,#fff,#9ab)">やられた〜！</div>
  <div class="result-line" id="loseStats"></div>
  <button class="big-btn" onclick="location.reload()">リベンジする！</button>
</div>

<script type="importmap">
{ "imports": { "three": "./lib/three.module.min.js" } }

<script type="module">
import * as THREE from 'three';

/* ================= 基本セットアップ ================= */
const IS_TOUCH = ('ontouchstart' in window) && navigator.maxTouchPoints > 0;
if (IS_TOUCH) document.body.classList.add('touch');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x8ed4f7);
scene.fog = new THREE.Fog(0x8ed4f7, 90, 240);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.getElementById('game').appendChild(renderer.domElement);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

const sun = new THREE.DirectionalLight(0xfff2d0, 2.0);
sun.position.set(60, 100, 40);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbfe8ff, 0x5a8f4a, 1.1));

/* ================= ゲーム状態 ================= */
const state = {
  phase: 'start',            // start | play | win | lose
  hp: 100, shield: 0, wood: 30, kills: 0,
  stormR: 115, stormT: 0,
  wave: 0, time: 0,
};
const clock = new THREE.Clock();

/* ================= サウンド ================= */
let AC = null;
function initAudio() { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); }
function tone(freq, dur, type = 'square', vol = 0.12, slideTo = null, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g).connect(AC.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  shoot:  () => tone(700, 0.09, 'square', 0.07, 220),
  hit:    () => tone(300, 0.08, 'sawtooth', 0.1, 150),
  pop:    () => { tone(500, 0.15, 'square', 0.12, 1200); tone(900, 0.2, 'triangle', 0.1, 1800, 0.05); },
  build:  () => tone(150, 0.12, 'triangle', 0.18, 90),
  wood:   () => tone(880, 0.07, 'triangle', 0.1, 1100),
  pickup: () => { [660, 880, 1320].forEach((f, i) => tone(f, 0.1, 'triangle', 0.1, null, i * 0.07)); },
  hurt:   () => tone(160, 0.2, 'sawtooth', 0.15, 80),
  jump:   () => tone(300, 0.12, 'triangle', 0.08, 600),
  wave:   () => { [440, 550, 660].forEach((f, i) => tone(f, 0.15, 'square', 0.08, null, i * 0.12)); },
  win:    () => { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, 0.22, 'triangle', 0.14, null, i * 0.15)); },
  lose:   () => { [400, 300, 200, 120].forEach((f, i) => tone(f, 0.25, 'sawtooth', 0.1, null, i * 0.2)); },
};

/* ================= 島をつくる ================= */
const walkables = [];   // 上に立てるメッシュ
const solids = [];      // {min, max} 弾やロボが当たるAABB

const ground = new THREE.Mesh(
  new THREE.CircleGeometry(100, 48),
  new THREE.MeshLambertMaterial({ color: 0x6abf5e })
);
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
walkables.push(ground);

// すなはま
const beach = new THREE.Mesh(
  new THREE.RingGeometry(98, 108, 48),
  new THREE.MeshLambertMaterial({ color: 0xeed9a4 })
);
beach.rotation.x = -Math.PI / 2;
beach.position.y = -0.12;
scene.add(beach);

// うみ
const sea = new THREE.Mesh(
  new THREE.PlaneGeometry(700, 700),
  new THREE.MeshLambertMaterial({ color: 0x3aa0d8 })
);
sea.rotation.x = -Math.PI / 2;
sea.position.y = -0.35;
scene.add(sea);

// くも
const clouds = [];
for (let i = 0; i < 7; i++) {
  const g = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: 0xffffff });
  for (let j = 0; j < 3; j++) {
    const puff = new THREE.Mesh(new THREE.SphereGeometry(4 + Math.random() * 3, 10, 8), mat);
    puff.position.set(j * 5 - 5, Math.random() * 1.5, Math.random() * 3);
    puff.scale.y = 0.55;
    g.add(puff);
  }
  g.position.set((Math.random() - 0.5) * 300, 38 + Math.random() * 18, (Math.random() - 0.5) * 300);
  scene.add(g);
  clouds.push(g);
}

// き（シュートするともくざいが手にはいる）
const trees = [];
const trunkMat = new THREE.MeshLambertMaterial({ color: 0x8a5a2b });
const leafMat = new THREE.MeshLambertMaterial({ color: 0x2e8b3d });
function addTree(x, z) {
  const g = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.6, 3, 8), trunkMat);
  trunk.position.y = 1.5;
  g.add(trunk);
  for (let i = 0; i < 3; i++) {
    const cone = new THREE.Mesh(new THREE.ConeGeometry(2.4 - i * 0.6, 2.2, 9), leafMat);
    cone.position.y = 3.2 + i * 1.4;
    g.add(cone);
  }
  g.position.set(x, 0, z);
  scene.add(g);
  trees.push({ g, x, z, bounce: 0 });
}
for (let i = 0; i < 42; i++) {
  const a = Math.random() * Math.PI * 2, r = 14 + Math.random() * 78;
  addTree(Math.cos(a) * r, Math.sin(a) * r);
}

// いえ
const houseData = [[-30, -22, 0xf2c94c], [35, 18, 0xf08a5d], [-14, 40, 0x9ad0ec], [22, -45, 0xc9a0f5]];
for (const [hx, hz, col] of houseData) {
  const body = new THREE.Mesh(new THREE.BoxGeometry(9, 5, 8), new THREE.MeshLambertMaterial({ color: col }));
  body.position.set(hx, 2.5, hz);
  scene.add(body);
  walkables.push(body);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(7.4, 3.4, 4), new THREE.MeshLambertMaterial({ color: 0xb04632 }));
  roof.position.set(hx, 6.7, hz);
  roof.rotation.y = Math.PI / 4;
  scene.add(roof);
  const door = new THREE.Mesh(new THREE.BoxGeometry(1.8, 3, 0.3), new THREE.MeshLambertMaterial({ color: 0x6b4423 }));
  door.position.set(hx, 1.5, hz + 4.1);
  scene.add(door);
  solids.push({ min: new THREE.Vector3(hx - 4.5, 0, hz - 4), max: new THREE.Vector3(hx + 4.5, 5, hz + 4) });
}

// いわ
const rockMat = new THREE.MeshLambertMaterial({ color: 0x9aa0a6 });
for (let i = 0; i < 14; i++) {
  const a = Math.random() * Math.PI * 2, r = 10 + Math.random() * 80;
  const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(0.8 + Math.random() * 1.4, 0), rockMat);
  rock.position.set(Math.cos(a) * r, 0.5, Math.sin(a) * r);
  rock.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
  scene.add(rock);
}

// はな
const flowerMats = [0xff6b9d, 0xffd54a, 0xffffff].map(c => new THREE.MeshLambertMaterial({ color: c }));
for (let i = 0; i < 40; i++) {
  const a = Math.random() * Math.PI * 2, r = 8 + Math.random() * 85;
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.22, 6, 5), flowerMats[i % 3]);
  f.position.set(Math.cos(a) * r, 0.2, Math.sin(a) * r);
  scene.add(f);
}

/* ================= ストーム ================= */
const stormMesh = new THREE.Mesh(
  new THREE.CylinderGeometry(1, 1, 60, 64, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xb44df0, transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false })
);
stormMesh.position.y = 30;
scene.add(stormMesh);

/* ================= プレイヤー ================= */
let suitColor = 0x3b82f6;
const player = {
  pos: new THREE.Vector3(0, 0, 55),
  vel: new THREE.Vector3(),
  yaw: Math.PI, pitch: 0.15,
  grounded: true,
  mesh: null,
};

function buildPlayerMesh() {
  const g = new THREE.Group();
  const suit = new THREE.MeshLambertMaterial({ color: suitColor });
  const skin = new THREE.MeshLambertMaterial({ color: 0xffd9b0 });
  const dark = new THREE.MeshLambertMaterial({ color: 0x2a2a3a });

  const legL = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.55, 0.25), dark); legL.position.set(-0.16, 0.28, 0);
  const legR = legL.clone(); legR.position.x = 0.16;
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.72, 0.8, 0.45), suit); body.position.y = 0.95;
  const armL = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.6, 0.2), suit); armL.position.set(-0.5, 1.0, 0);
  const armR = armL.clone(); armR.position.x = 0.5;
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 12, 10), skin); head.position.y = 1.72;
  const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 5), dark); eyeL.position.set(-0.12, 1.78, -0.29);
  const eyeR = eyeL.clone(); eyeR.position.x = 0.12;
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.38, 0.16, 12), suit); cap.position.y = 1.98;
  const capBrim = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.06, 0.3), suit); capBrim.position.set(0, 1.94, -0.4);
  const pack = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.55, 0.25), new THREE.MeshLambertMaterial({ color: 0x8a5a2b }));
  pack.position.set(0, 1.05, 0.36);
  const gun = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.14, 0.7), new THREE.MeshLambertMaterial({ color: 0x555566 }));

function buildEnemyMesh(color) {

  const footR = footL.clone(); footR.position.x = 0.26;
  g.add(body, eyeL, eyeR, pupL, pupR, antenna, ball, footL, footR);

  barFg.scale.set(1.44, 0.1, 1); barFg.position.y = 2.35; barFg.renderOrder = 999;
  g.add(barBg, barFg);

  const shadow = playerShadow.clone();
  shadow.material = playerShadow.material;
  return { g, barFg, shadow };

function spawnEnemy(waveDef) {
  let x, z;
  for (let tries = 0; tries < 20; tries++) {
    const a = Math.random() * Math.PI * 2;
    const r = 20 + Math.random() * Math.min(55, state.stormR - 15);
    x = Math.cos(a) * r; z = Math.sin(a) * r;
    if (Math.hypot(x - player.pos.x, z - player.pos.z) > 26) break;
  }
  const color = enemyPalette[Math.floor(Math.random() * enemyPalette.length)];
  const { g, barFg, shadow } = buildEnemyMesh(color);
  g.position.set(x, 0, z);
  scene.add(g); scene.add(shadow);
  enemies.push({
    mesh: g, barFg, shadow, color,
    hp: waveDef.hp, maxHp: waveDef.hp, speed: waveDef.speed,
    shootCd: 2 + Math.random() * 2, bobT: Math.random() * 6,
    orbitDir: Math.random() < 0.5 ? 1 : -1,
  });
}

const builds = [];  // {mesh, hp, aabb, isRamp}
const wallMat = new THREE.MeshLambertMaterial({ color: 0xc89a63 });
const MAX_BUILDS = 40;
const BUILD_COST = 10;

function cardinalYaw() {
  const q = Math.round(player.yaw / (Math.PI / 2)) * (Math.PI / 2);
  return q;
}

function tryBuild(isRamp) {
  if (state.phase !== 'play') return;
  if (state.wood < BUILD_COST) { showMsg('もくざいが たりない！ 🌳きをシュートしよう', 1.6); return; }
  if (builds.length >= MAX_BUILDS) { showMsg('これいじょう たてられないよ！', 1.6); return; }
  const cy = cardinalYaw();
  const fwd = new THREE.Vector3(-Math.sin(cy), 0, -Math.cos(cy));
  const base = player.pos.clone().add(fwd.clone().multiplyScalar(3.4));
  base.x = Math.round(base.x / 2) * 2;
  base.z = Math.round(base.z / 2) * 2;
  base.y = Math.max(0, player.pos.y);

  const group = new THREE.Group();
  group.position.copy(base);
  group.rotation.y = cy;
  let mesh;
  if (isRamp) {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 0.3, 5.4), wallMat);
    mesh.rotation.x = Math.atan2(3, 4);
    mesh.position.y = 1.5;
  } else {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(4, 3.2, 0.4), wallMat);
    mesh.position.y = 1.6;
    // まどわく風のライン
    const edge = new THREE.Mesh(new THREE.BoxGeometry(4.1, 0.18, 0.5), new THREE.MeshLambertMaterial({ color: 0x9a7040 }));
    edge.position.y = 1.6;
    mesh.add(edge);
  }
  group.add(mesh);
  scene.add(group);
  const aabb = new THREE.Box3().setFromObject(group);
  builds.push({ group, mesh, hp: 100, aabb, isRamp });
  walkables.push(mesh);
  if (!isRamp) solids.push({ min: aabb.min, max: aabb.max, build: true, ref: group });
  state.wood -= BUILD_COST;
  sfx.build();
  updateHud();
}

function destroyBuild(b) {
  scene.remove(b.group);
  const wi = walkables.indexOf(b.mesh); if (wi >= 0) walkables.splice(wi, 1);
  const si = solids.findIndex(s => s.ref === b.group); if (si >= 0) solids.splice(si, 1);
  const bi = builds.indexOf(b); if (bi >= 0) builds.splice(bi, 1);
  spawnBurst(b.group.position.clone().add(new THREE.Vector3(0, 1.5, 0)), 0xc89a63, 10);
}

/* --- タッチそうさ --- */
const joy = { active: false, id: null, x: 0, y: 0 };
const look = { active: false, id: null, lastX: 0, lastY: 0 };
let touchShoot = false;

if (IS_TOUCH) {
  const joyBase = document.getElementById('joyBase');
  const joyThumb = document.getElementById('joyThumb');
  const baseRect = () => joyBase.getBoundingClientRect();

  addEventListener('touchstart', e => {
    for (const t of e.changedTouches) {
      const el = document.elementFromPoint(t.clientX, t.clientY);
      if (el && el.closest('.touch-btn, .overlay')) continue;
      if (t.clientX < innerWidth * 0.45 && !joy.active) {
        joy.active = true; joy.id = t.identifier;
        updateJoy(t);
      } else if (!look.active) {
        look.active = true; look.id = t.identifier;
        look.lastX = t.clientX; look.lastY = t.clientY;
      }
    }
  }, { passive: false });

  addEventListener('touchmove', e => {
    e.preventDefault();
    for (const t of e.changedTouches) {
      if (joy.active && t.identifier === joy.id) updateJoy(t);
      if (look.active && t.identifier === look.id) {
        player.yaw -= (t.clientX - look.lastX) * 0.006;
        player.pitch = Math.max(-0.5, Math.min(1.2, player.pitch + (t.clientY - look.lastY) * 0.005));
        look.lastX = t.clientX; look.lastY = t.clientY;
      }
    }
  }, { passive: false });

  addEventListener('touchend', e => {
    for (const t of e.changedTouches) {
      if (t.identifier === joy.id) { joy.active = false; joy.x = joy.y = 0; joyThumb.style.transform = 'translate(-50%,-50%)'; }
      if (t.identifier === look.id) look.active = false;
    }
  });

  function updateJoy(t) {
    const r = baseRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = (t.clientX - cx) / (r.width / 2), dy = (t.clientY - cy) / (r.height / 2);
    const len = Math.hypot(dx, dy);
    if (len > 1) { dx /= len; dy /= len; }
    joy.x = dx; joy.y = dy;
    joyThumb.style.transform = `translate(calc(-50% + ${dx * 38}px), calc(-50% + ${dy * 38}px))`;
  }

  const hold = (id, down, up) => {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); down(); }, { passive: false });
    if (up) el.addEventListener('touchend', e => { e.preventDefault(); up(); });
  };
  hold('btnShoot', () => touchShoot = true, () => touchShoot = false);
  hold('btnJump', jump);
  hold('btnWall', () => tryBuild(false));
  hold('btnRamp', () => tryBuild(true));
}

/* ================= 地形の高さ ================= */
const downRay = new THREE.Raycaster();
const DOWN = new THREE.Vector3(0, -1, 0);
function groundHeightAt(x, y, z) {
  downRay.set(new THREE.Vector3(x, y + 0.7, z), DOWN);
  downRay.far = 60;
  const hits = downRay.intersectObjects(walkables, false);
  let best = 0;
  let found = false;
  for (const h of hits) {
    if (!found || h.point.y > best) { best = h.point.y; found = true; }
    found = true;
  }
  return found ? best : 0;
}

function pushOutOfSolids(pos, radius) {
  for (const s of solids) {
    if (pos.y > s.max.y - 0.3) continue;
    const cx = Math.max(s.min.x, Math.min(pos.x, s.max.x));
    const cz = Math.max(s.min.z, Math.min(pos.z, s.max.z));
    const dx = pos.x - cx, dz = pos.z - cz;
    const d2 = dx * dx + dz * dz;
    if (d2 < radius * radius) {
      if (d2 > 0.0001) {
        const d = Math.sqrt(d2);
        pos.x = cx + (dx / d) * radius;
        pos.z = cz + (dz / d) * radius;
      } else {
        pos.x += radius;
      }
    }
  }
}

/* ================= メインループ ================= */
const tmpV = new THREE.Vector3();

function updatePlayer(dt) {
  const fwd = new THREE.Vector3(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  const right = new THREE.Vector3(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const move = new THREE.Vector3();
  if (keys['KeyW'] || keys['ArrowUp']) move.add(fwd);
  if (keys['KeyS'] || keys['ArrowDown']) move.sub(fwd);
  if (keys['KeyD'] || keys['ArrowRight']) move.add(right);
  if (keys['KeyA'] || keys['ArrowLeft']) move.sub(right);
  if (IS_TOUCH && (joy.x || joy.y)) {
    move.add(fwd.clone().multiplyScalar(-joy.y));
    move.add(right.clone().multiplyScalar(joy.x));
  }
  const speed = 9;
  if (move.lengthSq() > 0) {
    move.normalize().multiplyScalar(speed);
  }
  player.pos.x += move.x * dt;
  player.pos.z += move.z * dt;

  // しまのそとに出ない
  const r = Math.hypot(player.pos.x, player.pos.z);
  if (r > 104) {
    player.pos.x *= 104 / r;
    player.pos.z *= 104 / r;
  }

  // じゅうりょく
  player.vel.y -= 30 * dt;
  player.pos.y += player.vel.y * dt;
  const gy = groundHeightAt(player.pos.x, player.pos.y, player.pos.z);
  if (player.vel.y <= 0 && player.pos.y <= gy + 0.02) {
    player.pos.y = gy;
    player.vel.y = 0;
    player.grounded = true;
  } else {
    player.grounded = false;
  }

  pushOutOfSolids(player.pos, 0.6);

  // メッシュとカメラ
  player.mesh.position.copy(player.pos);
  player.mesh.rotation.y = player.yaw;
  const bob = (move.lengthSq() > 0 && player.grounded) ? Math.sin(state.time * 12) * 0.05 : 0;
  player.mesh.position.y += bob;
  playerShadow.position.set(player.pos.x, groundHeightAt(player.pos.x, player.pos.y, player.pos.z) + 0.03, player.pos.z);

  const target = player.pos.clone().add(new THREE.Vector3(0, 1.7, 0));
  const cp = Math.cos(player.pitch), sp = Math.sin(player.pitch);
  const camOff = new THREE.Vector3(Math.sin(player.yaw) * cp, sp, Math.cos(player.yaw) * cp).multiplyScalar(6.5);
  camOff.y += 0.6;
  camera.position.copy(target).add(camOff);
  if (camera.position.y < 0.4) camera.position.y = 0.4;
  camera.lookAt(target);

  // シュート
  shootCd -= dt;
  if ((mouseDown || touchShoot)) playerShoot();
}

function updateEnemies(dt) {
  for (const e of enemies) {
    e.bobT += dt;
    const p = e.mesh.position;
    const toPlayer = tmpV.set(player.pos.x - p.x, 0, player.pos.z - p.z);
    const dist = toPlayer.length();
    toPlayer.normalize();

    if (dist > 16) {
      p.x += toPlayer.x * e.speed * dt;
      p.z += toPlayer.z * e.speed * dt;
    } else if (dist > 6) {
      // よこにまわりこむ
      p.x += (-toPlayer.z * e.orbitDir) * e.speed * 0.5 * dt + toPlayer.x * e.speed * 0.3 * dt;
      p.z += (toPlayer.x * e.orbitDir) * e.speed * 0.5 * dt + toPlayer.z * e.speed * 0.3 * dt;
    } else {
      p.x -= toPlayer.x * e.speed * 0.4 * dt;
      p.z -= toPlayer.z * e.speed * 0.4 * dt;
    }
    const rr = Math.hypot(p.x, p.z);
    if (rr > 100) { p.x *= 100 / rr; p.z *= 100 / rr; }
    pushOutOfSolids(p, 0.7);
    p.y = Math.abs(Math.sin(e.bobT * 3)) * 0.25;

    e.mesh.rotation.y = Math.atan2(-toPlayer.x, -toPlayer.z);
    e.shadow.position.set(p.x, 0.03, p.z);

    // シュート
    e.shootCd -= dt;
    if (e.shootCd <= 0 && dist < 32 && state.phase === 'play') {
      e.shootCd = 2.2 + Math.random() * 1.6;
      const origin = p.clone().add(new THREE.Vector3(0, 1.2, 0));
      const aim = player.pos.clone().add(new THREE.Vector3(0, 1.2, 0)).sub(origin).normalize();
      const m = new THREE.Mesh(orbGeo, orbMat);
      m.position.copy(origin);
      scene.add(m);
      enemyShots.push({ mesh: m, vel: aim.multiplyScalar(15), ttl: 4 });
    }
  }
}

function updateShots(dt) {
  // プレイヤーの星
  for (let i = playerShots.length - 1; i >= 0; i--) {
    const s = playerShots[i];
    s.ttl -= dt;
    s.mesh.position.addScaledVector(s.vel, dt);
    let dead = s.ttl <= 0;
    const sp = s.mesh.position;

    if (!dead) {
      // ロボにあたる
      for (let j = enemies.length - 1; j >= 0; j--) {
        const e = enemies[j];
        const ep = e.mesh.position;
        if (sp.distanceToSquared(new THREE.Vector3(ep.x, ep.y + 0.9, ep.z)) < 1.2) {
          e.hp -= 25;
          e.barFg.scale.x = 1.44 * Math.max(0, e.hp / e.maxHp);
          showDmg(sp, '25');
          spawnBurst(sp, e.color, 5);
          sfx.hit();
          dead = true;
          if (e.hp <= 0) {
            scene.remove(e.mesh); scene.remove(e.shadow);
            enemies.splice(j, 1);
            state.kills++;
            state.wood += 5;
            spawnBurst(new THREE.Vector3(ep.x, ep.y + 1, ep.z), e.color, 18);
            spawnBurst(new THREE.Vector3(ep.x, ep.y + 1, ep.z), 0xffe066, 8);
            sfx.pop();
            showDmg(new THREE.Vector3(ep.x, ep.y + 2, ep.z), '+5 🪵', '#a0e080');
            if (Math.random() < 0.45) {
              addPickup(['heart', 'shield', 'wood'][Math.floor(Math.random() * 3)], ep.x, ep.z);
            }
            checkWave();
          }
          updateHud();
          break;
        }
      }
    }
    if (!dead) {
      // きにあたる → もくざい
      for (const t of trees) {
        if (sp.y > 0 && sp.y < 6 && (sp.x - t.x) ** 2 + (sp.z - t.z) ** 2 < 2.6) {
          state.wood += 8;
          t.bounce = 1;
          showDmg(sp, '+8 🪵', '#a0e080');
          spawnBurst(sp, 0x2e8b3d, 6);
          sfx.wood();
          updateHud();
          dead = true;
          break;
        }
      }
    }
    if (!dead) {
      // かべ・いえにあたる
      for (const so of solids) {
        if (sp.x > so.min.x && sp.x < so.max.x && sp.y > so.min.y && sp.y < so.max.y && sp.z > so.min.z && sp.z < so.max.z) {
          spawnBurst(sp, 0xdddddd, 4);
          dead = true;
          break;
        }
      }
    }
    if (dead) { scene.remove(s.mesh); playerShots.splice(i, 1); }
  }

  // ロボのオーブ
  for (let i = enemyShots.length - 1; i >= 0; i--) {
    const s = enemyShots[i];
    s.ttl -= dt;
    s.mesh.position.addScaledVector(s.vel, dt);
    let dead = s.ttl <= 0;
    const sp = s.mesh.position;

    if (!dead && sp.distanceToSquared(player.pos.clone().add(new THREE.Vector3(0, 1.2, 0))) < 1.1) {
      damagePlayer(10);
      spawnBurst(sp, 0xff6bd6, 6);
      dead = true;
    }
    if (!dead) {
      for (const b of builds) {
        const a = b.aabb;
        if (sp.x > a.min.x && sp.x < a.max.x && sp.y > a.min.y && sp.y < a.max.y && sp.z > a.min.z && sp.z < a.max.z) {
          b.hp -= 34;
          spawnBurst(sp, 0xc89a63, 5);
          sfx.hit();
          if (b.hp <= 0) destroyBuild(b);
          dead = true;
          break;
        }
      }
    }
    if (!dead && sp.y < 0.1) dead = true;
    if (dead) { scene.remove(s.mesh); enemyShots.splice(i, 1); }
  }
}

function checkWave() {
  if (enemies.length > 0) return;
  if (state.wave < WAVES.length - 1) {
    state.wave++;
    setTimeout(() => { if (state.phase === 'play') startWave(); updateHud(); }, 1800);
    showMsg('ウェーブクリア！ ✨');
  } else if (state.phase === 'play') {
    state.phase = 'win';
    sfx.win();
    document.getElementById('winStats').textContent = `たおしたロボ: ${state.kills}たい ／ きみが さいごの ひとり！`;
    document.getElementById('winOverlay').classList.remove('hidden');
    document.exitPointerLock?.();
    for (let i = 0; i < 60; i++) {
      setTimeout(() => {
        const a = Math.random() * 6.28;
        spawnBurst(
          player.pos.clone().add(new THREE.Vector3(Math.cos(a) * 5, 3 + Math.random() * 4, Math.sin(a) * 5)),
          [0xffe066, 0xff6b9d, 0x74c0fc, 0x63e6be][i % 4], 6);
      }, i * 80);
    }
  }
}

function updateStorm(dt) {
  state.stormT += dt;
  const HOLD = 25, SHRINK = 150, MIN_R = 14;
  let r;
  if (state.stormT < HOLD) {
    r = 115;
    stormChip.textContent = `🌀 ストームまで ${Math.ceil(HOLD - state.stormT)}びょう`;
  } else {
    const p = Math.min(1, (state.stormT - HOLD) / SHRINK);
    r = 115 - (115 - MIN_R) * p;
    stormChip.textContent = p >= 1 ? '🌀 ストーム さいしょう！' : '🌀 ストームが ちぢんでいる！';
    if (state.stormT - dt < HOLD) showMsg('🌀 ストームが ちぢみはじめた！ まんなかへ にげろ！', 3);
  }
  state.stormR = r;
  stormMesh.scale.set(r, 1, r);
  stormMesh.rotation.y += dt * 0.05;

  // ストームダメージ
  if (Math.floor(state.stormT) !== Math.floor(state.stormT - dt)) {
    if (Math.hypot(player.pos.x, player.pos.z) > r) damagePlayer(5);
  }
}

function updateMisc(dt) {
  // パーティクル
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.ttl -= dt;
    p.vel.y -= 18 * dt;
    p.mesh.position.addScaledVector(p.vel, dt);
    p.mesh.rotation.x += dt * 6; p.mesh.rotation.y += dt * 5;
    p.mesh.scale.setScalar(Math.max(0.01, p.ttl));
    if (p.ttl <= 0 || p.mesh.position.y < 0) { scene.remove(p.mesh); particles.splice(i, 1); }
  }
  // き（ゆれ）
  for (const t of trees) {
    if (t.bounce > 0) {
      t.bounce -= dt * 2.5;
      const s = 1 + Math.sin(t.bounce * 20) * 0.06 * t.bounce;
      t.g.scale.set(s, 1 / s, s);
      if (t.bounce <= 0) t.g.scale.set(1, 1, 1);
    }
  }
  // アイテム
  for (let i = pickups.length - 1; i >= 0; i--) {
    const pk = pickups[i];
    pk.t += dt;
    pk.mesh.rotation.y += dt * 2;
    pk.mesh.position.y = 0.8 + Math.sin(pk.t * 3) * 0.18;
    if (state.phase === 'play' &&
        (pk.mesh.position.x - player.pos.x) ** 2 + (pk.mesh.position.z - player.pos.z) ** 2 < 2.6) {
      if (pk.type === 'wood') { state.wood += 40; showMsg('🪵 もくざい +40！', 1.2); }
      if (pk.type === 'heart') { state.hp = Math.min(100, state.hp + 30); showMsg('❤️ かいふく +30！', 1.2); }
      if (pk.type === 'shield') { state.shield = Math.min(100, state.shield + 35); showMsg('🛡️ シールド +35！', 1.2); }
      sfx.pickup();
      scene.remove(pk.mesh);
      pickups.splice(i, 1);
      updateHud();
    }
  }
  // くも
  for (const c of clouds) {
    c.position.x += dt * 1.2;
    if (c.position.x > 180) c.position.x = -180;
  }
  // ダメージすうじ
  for (let i = dmgNums.length - 1; i >= 0; i--) {
    const d = dmgNums[i];
    d.ttl -= dt;
    d.pos.y += dt * 1.5;
    tmpV.copy(d.pos).project(camera);
    if (tmpV.z < 1) {
      d.el.style.left = (tmpV.x * 0.5 + 0.5) * innerWidth + 'px';
      d.el.style.top = (-tmpV.y * 0.5 + 0.5) * innerHeight + 'px';
      d.el.style.opacity = Math.min(1, d.ttl * 2);
    } else d.el.style.opacity = 0;
    if (d.ttl <= 0) { d.el.remove(); dmgNums.splice(i, 1); }
  }
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  state.time += dt;
  if (state.phase === 'play') {
    updatePlayer(dt);
    updateEnemies(dt);
    updateShots(dt);
    updateStorm(dt);
  }
  updateMisc(dt);
  renderer.render(scene, camera);
}
animate();

// デバッグ用フック
window.__game = { state, enemies, player, trees, playerShoot };

// スタート前のカメラ（しまをぐるっと見る）
(function orbitPreview() {
  if (state.phase !== 'start') return;
  const t = performance.now() * 0.0001;
  camera.position.set(Math.cos(t) * 70, 32, Math.sin(t) * 70);
  camera.lookAt(0, 0, 0);
  requestAnimationFrame(orbitPreview);
})();
</script>
